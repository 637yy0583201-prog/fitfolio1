  <div class="modal" id="itemModal"><div class="dialog wide"><div class="dialog-head"><h2 id="itemModalTitle">录入新单品</h2><button type="button" class="icon-btn modal-close" aria-label="关闭">×</button></div><form id="itemForm"><div class="dialog-body"><div class="form-grid">

    <div class="field full"><span class="field-label">适用季节（可多选）</span><div class="checks" id="itemSeasonChecks"><label class="check"><input type="checkbox" value="春"><span>春</span></label><label class="check"><input type="checkbox" value="夏"><span>夏</span></label><label class="check"><input type="checkbox" value="秋"><span>秋</span></label><label class="check"><input type="checkbox" value="冬"><span>冬</span></label></div></div>

  </div></div><div class="dialog-foot"><button type="button" class="btn modal-close">取消</button><button class="btn primary" id="saveItemBtn">保存单品</button></div></form></div></div>

  <div class="modal" id="outfitModal"><div class="dialog wide"><div class="dialog-head"><h2 id="outfitModalTitle">新建穿搭</h2><button type="button" class="icon-btn modal-close" aria-label="关闭">×</button></div><form id="outfitForm"><div class="dialog-body"><div class="form-grid">
    <div class="field"><label for="outfitName">穿搭名称 <span class="req">*</span></label><input class="control" id="outfitName" maxlength="50" required placeholder="例如：周一通勤"></div>
    <div class="field"><span class="field-label">适用季节</span><div class="checks" id="outfitSeasonChecks"><label class="check"><input type="checkbox" value="春"><span>春</span></label><label class="check"><input type="checkbox" value="夏"><span>夏</span></label><label class="check"><input type="checkbox" value="秋"><span>秋</span></label><label class="check"><input type="checkbox" value="冬"><span>冬</span></label></div></div>
    <div class="field full"><label for="outfitNote">备注</label><textarea class="control" id="outfitNote" maxlength="300" placeholder="场合、配色或穿搭提示"></textarea></div>
    <div class="field full"><span class="field-label">选择已录入单品 <span class="req">*</span></span><small class="hint">至少选择一件，只能从“我的衣橱”中选择。切换类目不会清除已选单品。</small><div class="picker-tools"><select class="control" id="outfitCategoryFilter" aria-label="按品类筛选单品"><option value="">全部品类</option></select><span class="hint" id="pickerSelectionCount">已选择 0 件</span></div><div class="pick-grid" id="outfitPicker"></div></div>
  </div></div><div class="dialog-foot"><button type="button" class="btn modal-close">取消</button><button class="btn primary" id="saveOutfitBtn">保存穿搭</button></div></form></div></div>

  <div class="modal" id="outfitDetailModal"><div class="dialog wide"><div class="dialog-head"><h2 id="outfitDetailTitle">穿搭详情</h2><button type="button" class="icon-btn modal-close" aria-label="关闭">×</button></div><div class="dialog-body"><div class="detail-summary" id="outfitDetailSummary"></div><div class="detail-items" id="outfitDetailItems"></div></div><div class="dialog-foot"><button type="button" class="btn modal-close">关闭</button></div></div></div>
  <div class="modal image-modal" id="imageModal"><button type="button" class="icon-btn close-photo" aria-label="关闭">×</button><div class="dialog"><img id="largeImage" alt="图片预览"></div></div>
  <button type="button" class="back-top" id="backToTop" aria-label="回到顶部" title="回到顶部">↑</button>
  <div class="toast" id="toast"></div>

  <script>
  (()=>{
    'use strict';
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const DB_NAME='wardrobe_pocket_indexeddb_v1',DB_VERSION=1,LEGACY_KEY='wardrobe_pocket_local_v1';
    const categories=['上衣','裤子','半身裙','连衣裙','外套','鞋','包包','首饰','围巾帽子','其他'];
    const seasons=['春','夏','秋','冬'];
    const seasonMeta={春:{icon:'✿',className:'spring'},夏:{icon:'☀',className:'summer'},秋:{icon:'◆',className:'autumn'},冬:{icon:'❄',className:'winter'}};
    let db=null,state={items:[],outfits:[]},filterCategory='',filterSeasons=new Set(),itemKeyword='',outfitKeyword='',outfitPickerCategory='',outfitSelectedIds=new Set(),editingItemId=null,editingOutfitId=null,pendingImageBlob=null,previewUrl='',imageUrls=new Map();

    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
    function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
    function setBusy(button,on,text='处理中…'){if(!button)return;button.disabled=on;if(on){button.dataset.old=button.textContent;button.textContent=text}else if(button.dataset.old){button.textContent=button.dataset.old;delete button.dataset.old}}
    function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden'}
    function closeModal(el){(typeof el==='string'?$(el):el).classList.remove('open');if(!$('.modal.open'))document.body.style.overflow=''}
    function placeholder(t='衣'){return `<div class="placeholder">${esc(t)}</div>`}
    function picture(i){const src=imageUrls.get(i?.id);return src?`<img src="${src}" alt="${esc(i.name)}" loading="lazy">`:placeholder()}
    function seasonChip(season){const meta=seasonMeta[season]||{icon:'•',className:'spring'};return `<span class="chip season-chip season-${meta.className}"><span class="season-icon" aria-hidden="true">${meta.icon}</span>${esc(season)}</span>`}
    function selectedSeasons(root){return $$(`${root} input:checked`).map(x=>x.value)}
    function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('数据库操作失败'))})}
    function transactionDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('数据库事务失败'));tx.onabort=()=>reject(tx.error||new Error('数据库事务已取消'))})}

    function openDatabase(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('outfits'))d.createObjectStore('outfits',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('无法打开浏览器数据库'));req.onblocked=()=>reject(new Error('数据库正在被其他页面占用，请关闭其他页面后重试'))})}
    async function getAll(store){return request(db.transaction(store,'readonly').objectStore(store).getAll())}
    async function putRecord(store,value){const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value);await transactionDone(tx)}
    async function deleteItemAndRepairOutfits(id){const tx=db.transaction(['items','outfits'],'readwrite'),itemStore=tx.objectStore('items'),outfitStore=tx.objectStore('outfits');itemStore.delete(id);state.outfits.filter(o=>(o.itemIds||[]).includes(id)).forEach(o=>outfitStore.put({...o,itemIds:o.itemIds.filter(x=>x!==id),updatedAt:new Date().toISOString()}));await transactionDone(tx)}
    function dataUrlToBlob(dataUrl){return fetch(dataUrl).then(r=>r.blob())}
    function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(reader.error||new Error('图片编码失败'));reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob)})}
    function backupText(value,max=300){return value===null||value===undefined?'':String(value).slice(0,max)}
    async function createBackupPayload(){const items=await Promise.all(state.items.map(async item=>{const {imageBlob,...data}=item;return{...data,imageDataUrl:imageBlob instanceof Blob&&imageBlob.size?await blobToDataUrl(imageBlob):null}}));return{format:'fitfolio-backup',version:1,app:'Fitfolio',exportedAt:new Date().toISOString(),database:{name:DB_NAME,version:DB_VERSION},items,outfits:state.outfits.map(outfit=>({...outfit,itemIds:[...(outfit.itemIds||[])]}))}}
    async function parseBackupPayload(raw){if(!raw||typeof raw!=='object'||raw.format!=='fitfolio-backup'||Number(raw.version)!==1)throw new Error('不是受支持的 Fitfolio 备份文件');if(!Array.isArray(raw.items)||!Array.isArray(raw.outfits))throw new Error('备份文件缺少单品或穿搭数据');if(raw.items.length>5000||raw.outfits.length>5000)throw new Error('备份文件中的记录数量异常');const now=new Date().toISOString(),usedIds=new Set(),items=[];for(const source of raw.items){if(!source||typeof source!=='object')continue;let id=backupText(source.id,120)||uid();while(usedIds.has(id))id=uid();usedIds.add(id);let imageBlob=null;const imageData=source.imageDataUrl||source.image||'';if(imageData){if(typeof imageData!=='string'||!/^data:image\/(?:jpeg|png|webp|gif);base64,/i.test(imageData))throw new Error(`“${backupText(source.name,40)||'未命名单品'}”的图片格式无效`);imageBlob=await dataUrlToBlob(imageData)}const price=source.price===''||source.price===null||source.price===undefined?'':Math.max(0,Number(source.price)||0);items.push({id,name:backupText(source.name,40)||'未命名单品',category:backupText(source.category,30)||'其他',material:backupText(source.material,40),purchaseDate:backupText(source.purchaseDate,20),price,seasons:Array.isArray(source.seasons)?source.seasons.filter(s=>seasons.includes(s)):[],location:backupText(source.location,50),note:backupText(source.note,300),imageBlob,createdAt:backupText(source.createdAt,40)||now,updatedAt:backupText(source.updatedAt,40)||now})}const validIds=new Set(items.map(item=>item.id)),outfitIds=new Set(),outfits=[];for(const source of raw.outfits){if(!source||typeof source!=='object')continue;let id=backupText(source.id,120)||uid();while(outfitIds.has(id))id=uid();outfitIds.add(id);outfits.push({id,name:backupText(source.name,50)||'未命名穿搭',seasons:Array.isArray(source.seasons)?source.seasons.filter(s=>seasons.includes(s)):[],note:backupText(source.note,300),itemIds:Array.isArray(source.itemIds)?[...new Set(source.itemIds.map(String).filter(itemId=>validIds.has(itemId)))]:[],createdAt:backupText(source.createdAt,40)||now,updatedAt:backupText(source.updatedAt,40)||now})}return{items,outfits}}
    async function replaceAllData(items,outfits){const tx=db.transaction(['items','outfits'],'readwrite'),itemStore=tx.objectStore('items'),outfitStore=tx.objectStore('outfits');itemStore.clear();outfitStore.clear();items.forEach(item=>itemStore.put(item));outfits.forEach(outfit=>outfitStore.put(outfit));await transactionDone(tx)}
    async function migrateLegacy(){const raw=localStorage.getItem(LEGACY_KEY);if(!raw)return 0;let legacy;try{legacy=JSON.parse(raw)}catch{return 0}const oldItems=Array.isArray(legacy?.items)?legacy.items:[],oldOutfits=Array.isArray(legacy?.outfits)?legacy.outfits:[];if(!oldItems.length&&!oldOutfits.length){localStorage.removeItem(LEGACY_KEY);return 0}const converted=await Promise.all(oldItems.map(async x=>{let imageBlob=null;if(x.image){try{imageBlob=await dataUrlToBlob(x.image)}catch{imageBlob=null}}const item={...x,id:x.id||uid(),imageBlob};delete item.image;return item}));const convertedOutfits=oldOutfits.map(x=>({...x,id:x.id||uid()}));const tx=db.transaction(['items','outfits'],'readwrite'),itemStore=tx.objectStore('items'),outfitStore=tx.objectStore('outfits');converted.forEach(x=>itemStore.put(x));convertedOutfits.forEach(x=>outfitStore.put(x));await transactionDone(tx);localStorage.removeItem(LEGACY_KEY);return converted.length}
    function refreshImageUrls(){imageUrls.forEach(url=>URL.revokeObjectURL(url));imageUrls=new Map();state.items.forEach(i=>{if(i.imageBlob instanceof Blob&&i.imageBlob.size)imageUrls.set(i.id,URL.createObjectURL(i.imageBlob))})}
    async function reloadState(){const [items,outfits]=await Promise.all([getAll('items'),getAll('outfits')]);state={items:items.sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))),outfits:outfits.sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')))};refreshImageUrls();renderAll();await updateStorageState()}
    function formatBytes(n){if(!Number.isFinite(n))return'';if(n<1024*1024)return`${Math.max(0,n/1024).toFixed(0)} KB`;return`${(n/1024/1024).toFixed(1)} MB`}
    async function updateStorageState(){const e=$('#storageState');e.textContent='大容量本机存储';if(navigator.storage?.estimate){try{const x=await navigator.storage.estimate();if(Number.isFinite(x.usage))e.textContent=`已用 ${formatBytes(x.usage)}`}catch{}}}
    async function requestPersistentStorage(){if(navigator.storage?.persist){try{await navigator.storage.persist()}catch{}}}

    function searchable(parts){return parts.flat().filter(v=>v!==null&&v!==undefined).join(' ').toLocaleLowerCase()}
    function renderFilters(){const cats=['',...new Set([...categories,...state.items.map(i=>i.category).filter(Boolean)])];$('#categoryTabs').innerHTML=cats.map(c=>`<button class="tab ${filterCategory===c?'active':''}" data-value="${esc(c)}">${esc(c||'全部')}</button>`).join('');$('#seasonTabs').innerHTML=['',...seasons].map(s=>`<button class="tab ${(s?filterSeasons.has(s):filterSeasons.size===0)?'active':''}" data-value="${s}">${s||'全部'}</button>`).join('')}
    function renderItems(){renderFilters();const q=itemKeyword.trim().toLocaleLowerCase(),list=state.items.filter(i=>(!filterCategory||i.category===filterCategory)&&(filterSeasons.size===0||[...filterSeasons].some(s=>(i.seasons||[]).includes(s)))&&(!q||searchable([i.name,i.category,i.material,i.location,i.note,i.seasons]).includes(q)));$('#itemCount').textContent=`共 ${list.length} 件单品${q||filterCategory||filterSeasons.size?'（已筛选）':''}`;$('#itemGrid').innerHTML=list.length?list.map(i=>`<article class="card"><div class="photo">${picture(i)}</div><div class="card-body"><div class="title-row"><h3>${esc(i.name)}</h3><span class="category">${esc(i.category)}</span></div><div class="meta">${[i.material,i.location].filter(Boolean).map(esc).join(' · ')||'尚未填写材质和位置'}</div><div class="chips">${(i.seasons||[]).map(seasonChip).join('')}</div><div class="actions"><button class="btn small" data-act="edit" data-id="${i.id}">编辑</button><button class="btn small danger" data-act="delete" data-id="${i.id}">删除</button></div></div></article>`).join(''):`<div class="empty"><div class="symbol">♧</div><b>${state.items.length?'没有符合条件的单品':'衣橱还是空的'}</b><span>${state.items.length?'试试调整关键词、种类或季节':'点击右上角，录入第一件衣物吧'}</span></div>`;bindZoom('#itemGrid .photo img')}
    function renderOutfits(){const q=outfitKeyword.trim().toLocaleLowerCase(),list=state.outfits.map(o=>({...o,valid:(o.itemIds||[]).map(id=>state.items.find(i=>i.id===id)).filter(Boolean)})).filter(o=>!q||searchable([o.name,o.note,o.seasons,o.valid.map(i=>i.name),o.valid.map(i=>i.category)]).includes(q));$('#outfitCount').textContent=`共 ${list.length} 套穿搭${q?'（已筛选）':''}`;$('#outfitGrid').innerHTML=list.length?list.map(o=>`<article class="card outfit-card" tabindex="0" role="button" aria-label="查看穿搭 ${esc(o.name)} 的详情" data-outfit-id="${o.id}"><div class="collage ${o.valid.length===1?'one':''}">${o.valid.length?o.valid.slice(0,4).map(picture).join(''):placeholder('空')}</div><div class="outfit-info"><h3>${esc(o.name)}</h3><div class="chips">${(o.seasons||[]).map(seasonChip).join('')}</div>${o.note?`<p>${esc(o.note)}</p>`:''}<div class="open-hint">查看 ${o.valid.length} 件单品详情 ›</div><div class="actions"><button class="btn small" data-act="edit" data-id="${o.id}">编辑</button><button class="btn small danger" data-act="delete" data-id="${o.id}">删除</button></div></div></article>`).join(''):`<div class="empty"><div class="symbol">◇</div><b>${state.outfits.length?'没有符合条件的穿搭':'还没有穿搭方案'}</b><span>${state.outfits.length?'试试更换搜索关键词':state.items.length?'从衣橱中选择单品，组合第一套穿搭吧':'请先录入衣物，再创建穿搭'}</span></div>`}
    function renderAll(){renderItems();renderOutfits()}
    function bindZoom(sel){$$(sel).forEach(img=>img.addEventListener('click',()=>{$('#largeImage').src=img.src;$('#largeImage').alt=img.alt;openModal('#imageModal')}))}

    $$('.nav-btn[data-view]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.view;$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));$$('.nav-btn[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===name));window.scrollTo({top:0,behavior:'smooth'})}));
    $('#itemSearch').addEventListener('input',e=>{itemKeyword=e.target.value;renderItems()});
    $('#outfitSearch').addEventListener('input',e=>{outfitKeyword=e.target.value;renderOutfits()});
    $('#categoryTabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){filterCategory=b.dataset.value;renderItems()}});
    $('#seasonTabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;const season=b.dataset.value;if(!season)filterSeasons.clear();else if(filterSeasons.has(season))filterSeasons.delete(season);else filterSeasons.add(season);renderItems()});
    $$('.modal-close').forEach(b=>b.addEventListener('click',()=>closeModal(b.closest('.modal'))));
    $$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m)}));
    $('.close-photo').addEventListener('click',()=>closeModal('#imageModal'));
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.modal.open'))closeModal($('.modal.open'))});
    $('#backToTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
    window.addEventListener('scroll',()=>$('#backToTop').classList.toggle('show',window.scrollY>360),{passive:true});
    $('#exportBackupBtn').addEventListener('click',async()=>{if(!db)return;const button=$('#exportBackupBtn');try{setBusy(button,true,'正在导出…');const payload=await createBackupPayload(),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`fitfolio-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${payload.items.length} 件单品和 ${payload.outfits.length} 套穿搭`)}catch(err){alert(`导出失败：${err.message||'无法生成备份文件'}`)}finally{setBusy(button,false)}});
    $('#importBackupBtn').addEventListener('click',()=>{if(db)$('#backupFile').click()});
    $('#backupFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const button=$('#importBackupBtn');try{setBusy(button,true,'正在读取…');const raw=JSON.parse(await file.text()),backup=await parseBackupPayload(raw);if(!confirm(`将导入 ${backup.items.length} 件单品和 ${backup.outfits.length} 套穿搭，并覆盖当前浏览器中的现有数据。确定继续吗？`))return;await replaceAllData(backup.items,backup.outfits);await reloadState();toast('备份已恢复')}catch(err){alert(`导入失败：${err instanceof SyntaxError?'JSON 文件内容无效':err.message||'无法读取备份文件'}`)}finally{setBusy(button,false)}});

    $('#addItemBtn').addEventListener('click',()=>{if(db)openItemEditor()});
    $('#chooseImageBtn').addEventListener('click',()=>$('#itemImage').click());
    $('#removeImageBtn').addEventListener('click',()=>{pendingImageBlob=null;showPreview()});
    $('#itemImage').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('请选择图片文件');const button=$('#chooseImageBtn');try{setBusy(button,true,'正在压缩…');pendingImageBlob=await compressImage(f);showPreview()}catch{alert('图片读取失败')}finally{setBusy(button,false);e.target.value=''}});
    function clearPreviewUrl(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=''}}
    function showPreview(){clearPreviewUrl();if(pendingImageBlob instanceof Blob&&pendingImageBlob.size){previewUrl=URL.createObjectURL(pendingImageBlob);$('#imagePreview').innerHTML=`<img src="${previewUrl}" alt="预览">`}else $('#imagePreview').textContent='暂无图片';$('#removeImageBtn').classList.toggle('hidden',!pendingImageBlob)}
    function openItemEditor(id=null){editingItemId=id;const i=id?state.items.find(x=>x.id===id):null;$('#itemModalTitle').textContent=i?'编辑单品':'录入新单品';$('#itemForm').reset();pendingImageBlob=i?.imageBlob||null;$('#itemName').value=i?.name||'';$('#itemCategory').value=i?.category||'';$('#itemMaterial').value=i?.material||'';$('#purchaseDate').value=i?.purchaseDate||'';$('#purchasePrice').value=i?.price??'';$('#storageLocation').value=i?.location||'';$$('#itemSeasonChecks input').forEach(c=>c.checked=(i?.seasons||[]).includes(c.value));$('#itemNote').value=i?.note||'';showPreview();openModal('#itemModal');setTimeout(()=>$('#itemName').focus(),30)}
    $('#itemForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#saveItemBtn'),old=state.items.find(x=>x.id===editingItemId);const item={id:editingItemId||uid(),name:$('#itemName').value.trim(),category:$('#itemCategory').value,material:$('#itemMaterial').value.trim(),purchaseDate:$('#purchaseDate').value,price:$('#purchasePrice').value===''?'':Math.max(0,Number($('#purchasePrice').value)||0),seasons:selectedSeasons('#itemSeasonChecks'),location:$('#storageLocation').value.trim(),note:$('#itemNote').value.trim(),imageBlob:pendingImageBlob||null,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};try{setBusy(b,true,'正在保存…');await putRecord('items',item);await reloadState();clearPreviewUrl();closeModal('#itemModal');toast(old?'单品已更新':'单品已保存')}catch(err){alert(`保存失败：${err?.name==='QuotaExceededError'?'设备可用存储空间不足':err.message||'浏览器数据库错误'}`)}finally{setBusy(b,false)}});
    $('#itemGrid').addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const i=state.items.find(x=>x.id===b.dataset.id);if(!i)return;if(b.dataset.act==='edit')return openItemEditor(i.id);if(confirm(`确定删除“${i.name}”吗？它也会从相关穿搭中移除。`)){try{await deleteItemAndRepairOutfits(i.id);await reloadState();toast('单品已删除')}catch(err){alert(`删除失败：${err.message}`)}}});
    function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(image.width,image.height)),w=Math.max(1,Math.round(image.width*scale)),h=Math.max(1,Math.round(image.height*scale)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(image,0,0,w,h);canvas.toBlob(blob=>{if(blob)return resolve(blob);canvas.toBlob(fallback=>fallback?resolve(fallback):reject(new Error('图片压缩失败')),'image/jpeg',.72)},'image/webp',.72)};image.src=reader.result};reader.readAsDataURL(file)})}

    $('#addOutfitBtn').addEventListener('click',()=>{if(!db)return;if(!state.items.length)return toast('请先录入至少一件单品');openOutfitEditor()});
    function renderOutfitPicker(){const list=state.items.filter(i=>!outfitPickerCategory||i.category===outfitPickerCategory);$('#pickerSelectionCount').textContent=`已选择 ${outfitSelectedIds.size} 件`;$('#outfitPicker').innerHTML=list.length?list.map(i=>`<div class="pick"><input type="checkbox" id="pick-${i.id}" value="${i.id}" ${outfitSelectedIds.has(i.id)?'checked':''}><label for="pick-${i.id}">${picture(i)}<b>${esc(i.name)}</b></label></div>`).join(''):`<div class="picker-empty">这个品类还没有单品</div>`}
    function openOutfitEditor(id=null){editingOutfitId=id;const o=id?state.outfits.find(x=>x.id===id):null;outfitSelectedIds=new Set((o?.itemIds||[]).filter(itemId=>state.items.some(i=>i.id===itemId)));outfitPickerCategory='';$('#outfitModalTitle').textContent=o?'编辑穿搭':'新建穿搭';$('#outfitForm').reset();$('#outfitName').value=o?.name||'';$$('#outfitSeasonChecks input').forEach(c=>c.checked=(o?.seasons||[]).includes(c.value));$('#outfitNote').value=o?.note||'';const cats=[...new Set(state.items.map(i=>i.category).filter(Boolean))];$('#outfitCategoryFilter').innerHTML=`<option value="">全部品类</option>${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}`;renderOutfitPicker();openModal('#outfitModal');setTimeout(()=>$('#outfitName').focus(),30)}
    $('#outfitCategoryFilter').addEventListener('change',e=>{outfitPickerCategory=e.target.value;renderOutfitPicker()});
    $('#outfitPicker').addEventListener('change',e=>{const input=e.target.closest('input[type="checkbox"]');if(!input)return;if(input.checked)outfitSelectedIds.add(input.value);else outfitSelectedIds.delete(input.value);$('#pickerSelectionCount').textContent=`已选择 ${outfitSelectedIds.size} 件`});
    $('#outfitForm').addEventListener('submit',async e=>{e.preventDefault();const ids=[...outfitSelectedIds].filter(id=>state.items.some(i=>i.id===id));if(!ids.length)return alert('请至少选择一件已录入的单品');const b=$('#saveOutfitBtn'),old=state.outfits.find(x=>x.id===editingOutfitId),outfit={id:editingOutfitId||uid(),name:$('#outfitName').value.trim(),seasons:selectedSeasons('#outfitSeasonChecks'),note:$('#outfitNote').value.trim(),itemIds:ids,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};try{setBusy(b,true,'正在保存…');await putRecord('outfits',outfit);await reloadState();closeModal('#outfitModal');toast(old?'穿搭已更新':'穿搭已保存')}catch(err){alert(`保存失败：${err.message}`)}finally{setBusy(b,false)}});
    function priceText(value){if(value===''||value===null||value===undefined)return'未填写';const n=Number(value);return Number.isFinite(n)?`¥${n.toFixed(2).replace(/\.00$/,'')}`:'未填写'}
    function openOutfitDetail(id){const o=state.outfits.find(x=>x.id===id);if(!o)return;const items=(o.itemIds||[]).map(itemId=>state.items.find(i=>i.id===itemId)).filter(Boolean);$('#outfitDetailTitle').textContent=o.name||'穿搭详情';$('#outfitDetailSummary').innerHTML=`<div class="chips">${(o.seasons||[]).map(seasonChip).join('')||'<span class="chip">未设置季节</span>'}</div><p>${o.note?esc(o.note):'暂无穿搭备注'}</p>`;$('#outfitDetailItems').innerHTML=items.length?items.map(i=>`<article class="detail-item"><div class="detail-item-media">${picture(i)}</div><div><h3>${esc(i.name)}</h3><div class="detail-list"><span>品类：${esc(i.category||'未填写')}</span><span>材质：${esc(i.material||'未填写')}</span><span>季节：${esc((i.seasons||[]).join('、')||'未填写')}</span><span>购买时间：${esc(i.purchaseDate||'未填写')}</span><span>价格：${esc(priceText(i.price))}</span><span>位置：${esc(i.location||'未填写')}</span></div>${i.note?`<p class="detail-note">${esc(i.note)}</p>`:''}</div></article>`).join(''):`<div class="empty"><b>这套穿搭暂无有效单品</b></div>`;bindZoom('#outfitDetailItems img');openModal('#outfitDetailModal')}
    async function handleOutfitAction(o,action){if(action==='edit')return openOutfitEditor(o.id);if(action==='delete'&&confirm(`确定删除穿搭“${o.name}”吗？`)){try{const tx=db.transaction('outfits','readwrite');tx.objectStore('outfits').delete(o.id);await transactionDone(tx);await reloadState();toast('穿搭已删除')}catch(err){alert(`删除失败：${err.message}`)}}}
    $('#outfitGrid').addEventListener('click',async e=>{const button=e.target.closest('button[data-act]'),card=e.target.closest('[data-outfit-id]');if(!card)return;const o=state.outfits.find(x=>x.id===(button?.dataset.id||card.dataset.outfitId));if(!o)return;if(button){e.stopPropagation();await handleOutfitAction(o,button.dataset.act)}else openOutfitDetail(o.id)});
    $('#outfitGrid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){const card=e.target.closest('[data-outfit-id]');if(card){e.preventDefault();openOutfitDetail(card.dataset.outfitId)}}});

    async function init(){try{if(!('indexedDB'in window))throw new Error('当前浏览器不支持 IndexedDB');db=await openDatabase();const migrated=await migrateLegacy();await requestPersistentStorage();await reloadState();if(migrated)toast(`已自动迁移 ${migrated} 件原有单品`)}catch(err){console.error(err);$('#storageState').textContent='存储不可用';alert(`无法启动本机数据库：${err.message}\n请使用最新版 Safari、Chrome 或 Edge 打开。`)}}
    window.addEventListener('beforeunload',()=>{clearPreviewUrl();imageUrls.forEach(url=>URL.revokeObjectURL(url));db?.close()});
    init();
  })();
  </script>
</body>
</html>
